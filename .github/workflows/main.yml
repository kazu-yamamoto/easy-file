name: Haskell CI

on:
  push:
    branches: [ 'main', 'ci' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:  [ 'ubuntu-latest', 'macOS-latest', 'windows-latest' ]
        ghc: [ '9.2', '9.4', '9.6', '9.8', '9.10', '9.12', '9.14' ]

    steps:
    - uses: actions/checkout@v7

    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: latest
        cabal-update:  true

    # The macOS image selects Xcode 26.6, whose ld cannot read the SDK 27
    # stubs that clang picks up from the Command Line Tools.
    - name: Link with the Command Line Tools
      if: ${{ runner.os == 'macOS' }}
      run: sudo xcode-select -s /Library/Developer/CommandLineTools

    - name: Configure
      run: cabal configure --enable-tests --disable-benchmarks

    - name: Cache (restore)
      uses: actions/cache/restore@v6
      id:   cache
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: build-${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('**/*.cabal', '**/cabal.project*') }}
        restore-keys: build-${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-

    - name: Install dependencies
      run: cabal build --only-dependencies

    - name: Cache (save)
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Build
      run: cabal build all

    - name: Run tests
      run: cabal test --test-show-details=streaming
